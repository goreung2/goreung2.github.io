<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>여백 — 일상의 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root{
    --bg: #EEF1EA;
    --card: #F9FAF6;
    --ink: #1B271F;
    --ink-soft: #55635A;
    --ink-faint: #8B9689;
    --accent: #B8862E;
    --accent-2: #5C7A5E;
    --line: #D6DCCE;
    --radius: 4px;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0; background: var(--bg); color: var(--ink);
    font-family: 'Pretendard', -apple-system, sans-serif;
    line-height:1.6; -webkit-font-smoothing: antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  ::selection{ background: var(--accent); color: var(--bg); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  button{ font-family:inherit; cursor:pointer; }
  .wrap{ max-width:860px; margin:0 auto; padding:0 28px; }

  header.site{ padding:28px 0 0; }
  .nav{
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:20px; border-bottom:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink-soft);
  }
  .nav .mark{ font-family:'Fraunces', serif; font-weight:600; font-size:18px; color:var(--ink); }

  .hero{ padding:70px 0 50px; }
  .hero .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--accent-2); letter-spacing:.08em; margin-bottom:16px; }
  h1.title{ font-family:'Fraunces', serif; font-weight:500; font-size:clamp(36px,6vw,58px); line-height:1.14; margin:0 0 18px; letter-spacing:-.01em; }
  .hero p.sub{ font-size:16px; color:var(--ink-soft); max-width:480px; margin:0; }
  .divider{ height:1px; background:var(--line); }

  section.posts{ padding:50px 0 100px; }
  .posts .label{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-faint); letter-spacing:.08em; margin-bottom:26px; }
  .empty-state, .error-state{ padding:50px 0; color:var(--ink-faint); font-size:14px; text-align:center; border:1px dashed var(--line); border-radius:var(--radius); }
  .error-state{ color:#A5473A; border-color:#e3c9c4; }

  .post{
    display:grid; grid-template-columns:100px 1fr; gap:24px;
    padding:26px 0; border-bottom:1px solid var(--line);
    opacity:0; transform:translateY(14px); transition:opacity .5s ease, transform .5s ease;
  }
  .post.in-view{ opacity:1; transform:translateY(0); }
  .post .date{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-faint); padding-top:4px; }
  .post-title{ font-family:'Fraunces', serif; font-weight:500; font-size:22px; margin:0 0 8px; position:relative; display:inline-block; cursor:pointer; transition:color .3s ease; }
  .post-title:hover{ color:var(--accent); }
  .post-title .underline{ position:absolute; left:0; bottom:-3px; height:1px; width:0; background:var(--accent); transition:width .4s ease; }
  .post-title:hover .underline{ width:100%; }
  .post .excerpt{ color:var(--ink-soft); font-size:14.5px; margin:0 0 12px; max-width:560px; }
  .tags{ display:flex; gap:8px; flex-wrap:wrap; }
  .tag{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--accent-2); background:var(--card); border:1px solid var(--line); padding:3px 9px; border-radius:var(--radius); }

  footer{ padding:40px 0 60px; border-top:1px solid var(--line); }
  .foot-row{ display:flex; justify-content:space-between; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-faint); flex-wrap:wrap; gap:10px; }

  .overlay{
    position:fixed; inset:0; background:rgba(27,39,34,.5);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 20px; overflow-y:auto; z-index:50;
    opacity:0; transition:opacity .25s ease;
  }
  .overlay.show{ display:flex; opacity:1; }
  .panel{
    background:var(--card); border-radius:6px; max-width:680px; width:100%;
    padding:40px; box-shadow:0 20px 60px rgba(27,39,34,.25);
    transform:translateY(14px); transition:transform .3s ease;
  }
  .overlay.show .panel{ transform:translateY(0); }
  .panel-top{ display:flex; justify-content:flex-end; margin-bottom:10px; }
  .closebtn{ background:none; border:none; font-size:20px; color:var(--ink-faint); line-height:1; }
  .closebtn:hover{ color:var(--ink); }
  .detail-date{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-faint); margin-bottom:10px; }
  .detail-title{ font-family:'Fraunces', serif; font-size:32px; font-weight:500; margin:0 0 16px; }
  .detail-body{ font-size:16px; color:var(--ink); }
  .detail-body h1, .detail-body h2, .detail-body h3{
    font-family:'Fraunces', serif; font-weight:500; line-height:1.3;
    margin:28px 0 12px;
  }
  .detail-body h1{ font-size:26px; }
  .detail-body h2{ font-size:22px; }
  .detail-body h3{ font-size:19px; }
  .detail-body p{ margin:0 0 16px; }
  .detail-body ul, .detail-body ol{ margin:0 0 16px; padding-left:22px; }
  .detail-body li{ margin-bottom:6px; }
  .detail-body a{ color:var(--accent); border-bottom:1px solid var(--accent); }
  .detail-body strong{ color:var(--ink); }
  .detail-body blockquote{
    margin:0 0 16px; padding:4px 18px; border-left:3px solid var(--accent-2);
    color:var(--ink-soft); font-style:italic; background:rgba(92,122,94,0.06);
  }
  .detail-body hr{ border:none; border-top:1px solid var(--line); margin:28px 0; }
  .detail-body img{
    max-width:100%; height:auto; border-radius:6px; margin:8px 0 20px; display:block;
  }
  .detail-body code{
    font-family:'IBM Plex Mono', monospace; font-size:0.88em;
    background:var(--bg); border:1px solid var(--line); border-radius:3px;
    padding:1px 6px;
  }
  .detail-body pre{
    margin:0 0 20px; border-radius:6px; overflow-x:auto;
    padding:16px 18px; font-size:13.5px; line-height:1.6;
  }
  .detail-body pre code{
    background:none; border:none; padding:0; font-size:inherit;
  }
  .detail-body table{ width:100%; border-collapse:collapse; margin:0 0 20px; font-size:14.5px; }
  .detail-body th, .detail-body td{ border:1px solid var(--line); padding:8px 10px; text-align:left; }
  .detail-body th{ background:var(--bg); font-family:'IBM Plex Mono', monospace; font-size:12.5px; }
  .detail-body mark{ background:rgba(184,134,46,0.25); color:var(--ink); padding:0 3px; border-radius:2px; }
  .detail-body sup{ font-size:0.7em; color:var(--accent-2); }

  /* image sizing & alignment */
  .detail-body img.img-small{ max-width:220px; }
  .detail-body img.img-medium{ max-width:420px; }
  .detail-body img.img-large{ max-width:100%; }
  .detail-body img.img-full{ width:100%; max-width:none; }
  .detail-body img.img-left{ float:left; margin:4px 20px 16px 0; }
  .detail-body img.img-right{ float:right; margin:4px 0 16px 20px; }
  .detail-body img.img-center{ margin-left:auto; margin-right:auto; }
  .detail-body .img-figure{ margin:8px 0 20px; }
  .detail-body .img-figure img{ margin:0 0 8px; }
  .detail-body .img-figure.img-left, .detail-body .img-figure.img-right{ max-width:45%; }
  .detail-body figcaption{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-faint);
    text-align:center;
  }

  /* callout boxes */
  .detail-body .callout{
    border:1px solid var(--line); border-left-width:4px; border-radius:4px;
    padding:14px 18px; margin:0 0 20px; background:var(--card);
  }
  .detail-body .callout p:last-child{ margin-bottom:0; }
  .detail-body .callout-label{
    font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:500;
    letter-spacing:.04em; margin:0 0 8px; text-transform:uppercase;
  }
  .detail-body .callout-tip{ border-left-color:var(--accent-2); }
  .detail-body .callout-tip .callout-label{ color:var(--accent-2); }
  .detail-body .callout-info{ border-left-color:#4A7A9E; }
  .detail-body .callout-info .callout-label{ color:#4A7A9E; }
  .detail-body .callout-warning{ border-left-color:var(--accent); }
  .detail-body .callout-warning .callout-label{ color:var(--accent); }
  .detail-body .callout-note{ border-left-color:var(--ink-faint); }
  .detail-body .callout-note .callout-label{ color:var(--ink-soft); }

  /* columns */
  .detail-body .columns{ display:flex; gap:24px; margin:0 0 20px; }
  .detail-body .columns .col{ flex:1; min-width:0; }
  .detail-body .columns .col p:last-child{ margin-bottom:0; }
  @media (max-width:560px){
    .detail-body .columns{ flex-direction:column; gap:8px; }
  }

  /* button links */
  .detail-body .btn-link{
    display:inline-block; background:var(--ink); color:var(--bg) !important;
    border:none !important; padding:9px 18px; border-radius:var(--radius);
    font-family:'IBM Plex Mono', monospace; font-size:13px; margin:4px 0 20px;
    transition:background .25s ease;
  }
  .detail-body .btn-link:hover{ background:var(--accent-2); }

  /* code block language label */
  .detail-body .code-wrap{ position:relative; margin:0 0 20px; }
  .detail-body .code-wrap pre{ margin:0; }
  .detail-body .code-lang{
    position:absolute; top:0; right:0; font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:.05em; color:var(--ink-faint); background:var(--bg);
    border:1px solid var(--line); border-top:none; border-right:none;
    padding:3px 9px; border-radius:0 6px 0 6px; text-transform:uppercase;
  }
  .detail-tags{ display:flex; gap:8px; margin-top:24px; }

  @media (max-width:560px){
    .post{ grid-template-columns:1fr; gap:6px; }
    .panel{ padding:26px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
    .post{ opacity:1; transform:none; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <nav class="nav">
      <span class="mark">여백.</span>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <p class="eyebrow">내 쪼대로 올리는곳</p>
    <h1 class="title">일상의 여백에서<br>길어 올린 문장들</h1>
    <p class="sub">그냥, 좋아보이는거, 소소한거, 거창한거 전부 올리는곳이에요!</p>
  </div>
</section>

<div class="wrap"><div class="divider"></div></div>

<section class="posts">
  <div class="wrap">
    <p class="label">RECENT POSTS</p>
    <div id="postList"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-row">
      <span>© 2026 여백. 조용히 쓰고 있습니다.</span>
      <a href="#">RSS</a>
    </div>
  </div>
</footer>

<div class="overlay" id="detailOverlay">
  <div class="panel">
    <div class="panel-top">
      <button class="closebtn" data-close="detailOverlay">✕</button>
    </div>
    <div class="detail-date" id="detailDate"></div>
    <h2 class="detail-title" id="detailTitle"></h2>
    <div class="detail-body" id="detailBody"></div>
    <div class="detail-tags" id="detailTags"></div>
  </div>
</div>

<script>
  const postList = document.getElementById('postList');
  marked.setOptions({ breaks: true, gfm: true });

  const NAMED_COLORS = {
    gold: '#B8862E', green: '#5C7A5E', red: '#A5473A',
    ink: '#1B271F', blue: '#4A7A9E', gray: '#8B9689', grey: '#8B9689'
  };

  function parseAttrTokens(str){
    const tokens = {}; const flags = [];
    const re = /([a-zA-Z]+)="([^"]*)"|([a-zA-Z]+)=(\S+)|([a-zA-Z]+)/g;
    let m;
    while((m = re.exec(str)) !== null){
      if(m[1]) tokens[m[1]] = m[2];
      else if(m[3]) tokens[m[3]] = m[4];
      else if(m[5]) flags.push(m[5]);
    }
    return { tokens, flags };
  }

  function processImages(md){
    return md.replace(/!\[([^\]]*)\]\(([^\s)]+)\)(\{([^}]*)\})?/g, (full, alt, src, _, attrStr)=>{
      let sizeClass = '', alignClass = '', caption = '', widthPx = '';
      if(attrStr){
        const { tokens, flags } = parseAttrTokens(attrStr);
        flags.forEach(f=>{
          if(['small','medium','large','full'].includes(f)) sizeClass = 'img-' + f;
          if(['left','right','center'].includes(f)) alignClass = 'img-' + f;
        });
        if(tokens.caption) caption = tokens.caption;
        if(tokens.width) widthPx = tokens.width;
      }
      const cls = [sizeClass, alignClass].filter(Boolean).join(' ');
      const style = widthPx ? ` style="width:${widthPx}px;"` : '';
      if(caption){
        return `<figure class="img-figure ${cls}"><img src="${src}" alt="${alt}"${style}><figcaption>${caption}</figcaption></figure>`;
      }
      return `<img src="${src}" alt="${alt}" class="${cls}"${style}>`;
    });
  }

  function processColorSpans(md){
    return md.replace(/\{color:([#a-zA-Z0-9]+)\}([\s\S]*?)\{\/color\}/g, (full, color, text)=>{
      const c = NAMED_COLORS[color.toLowerCase()] || color;
      return `<span style="color:${c}">${text}</span>`;
    });
  }

  function processHighlight(md){
    return md.replace(/==([^=\n]+)==/g, '<mark>$1</mark>');
  }

  function processSuperscript(md){
    return md.replace(/\^([^\^\s]+)\^/g, '<sup>$1</sup>');
  }

  function processButtons(md){
    return md.replace(/\[([^\]]+)\]\(([^\s)]+)\)\{button\}/g, '<a href="$2" class="btn-link">$1</a>');
  }

  function processColumns(md){
    return md.replace(/^:::columns\s*\n([\s\S]*?)\n:::\s*$/gm, (full, inner)=>{
      const cols = inner.split(/^---$/m).map(c=> `<div class="col">${renderMarkdown(c.trim())}</div>`).join('');
      return `<div class="columns">${cols}</div>`;
    });
  }

  function processCallouts(md){
    const labels = { tip: '💡 TIP', info: 'ℹ️ INFO', warning: '⚠️ WARNING', note: '📝 NOTE' };
    return md.replace(/^:::(tip|info|warning|note)\s*\n([\s\S]*?)\n:::\s*$/gm, (full, type, inner)=>{
      return `<div class="callout callout-${type}"><p class="callout-label">${labels[type]}</p>${renderMarkdown(inner.trim())}</div>`;
    });
  }

  function renderMarkdown(md){
    let out = md;
    out = processColumns(out);
    out = processCallouts(out);
    out = processButtons(out);
    out = processImages(out);
    out = processColorSpans(out);
    out = processHighlight(out);
    out = processSuperscript(out);
    return marked.parse(out);
  }

  document.querySelectorAll('[data-close]').forEach(btn=>{
    btn.addEventListener('click', ()=> document.getElementById(btn.dataset.close).classList.remove('show'));
  });
  document.querySelectorAll('.overlay').forEach(ov=>{
    ov.addEventListener('click', (e)=>{ if(e.target === ov) ov.classList.remove('show'); });
  });

  function fmtDate(d){
    const dt = new Date(d);
    if(isNaN(dt)) return d;
    return `${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function renderPosts(posts){
    postList.innerHTML = '';
    if(!posts || posts.length === 0){
      postList.innerHTML = `<div class="empty-state">아직 posts.json에 글이 없어요.</div>`;
      return;
    }
    const sorted = [...posts].sort((a,b)=> new Date(b.date) - new Date(a.date));
    sorted.forEach(p=>{
      const article = document.createElement('article');
      article.className = 'post';
      article.innerHTML = `
        <div class="date">${fmtDate(p.date)}</div>
        <div>
          <h2 class="post-title" data-id="${p.id}">${escapeHtml(p.title)}<span class="underline"></span></h2>
          <p class="excerpt">${escapeHtml(p.excerpt || '')}</p>
          <div class="tags">${(p.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
        </div>`;
      postList.appendChild(article);
    });

    postList.querySelectorAll('.post-title').forEach(t=>{
      t.addEventListener('click', ()=> openPost(posts.find(x=> String(x.id) === t.dataset.id)));
    });

    const io = new IntersectionObserver((entries)=>{
      entries.forEach((entry,i)=>{
        if(entry.isIntersecting){
          setTimeout(()=> entry.target.classList.add('in-view'), i*80);
          io.unobserve(entry.target);
        }
      });
    }, { threshold: .15 });
    document.querySelectorAll('.post').forEach(p=> io.observe(p));
  }

  function openPost(meta){
    if(!meta) return;
    const dEl = document.getElementById('detailDate');
    const tEl = document.getElementById('detailTitle');
    const bEl = document.getElementById('detailBody');
    const tagsEl = document.getElementById('detailTags');

    dEl.textContent = meta.date;
    tEl.textContent = meta.title;
    bEl.textContent = '불러오는 중...';
    tagsEl.innerHTML = (meta.tags||[]).map(x=>`<span class="tag">${escapeHtml(x)}</span>`).join('');
    document.getElementById('detailOverlay').classList.add('show');

    // 글 본문은 목록과 별개로, 클릭한 시점에 개별 파일에서 불러옵니다.
    fetch(`posts/${meta.file || (meta.id + '.json')}`, { cache: 'no-store' })
      .then(res=>{
        if(!res.ok) throw new Error('posts/' + (meta.file || meta.id + '.json') + '을 불러오지 못했습니다 (' + res.status + ')');
        return res.json();
      })
      .then(full=>{
        bEl.innerHTML = renderMarkdown(full.content || '(내용 없음)');
        bEl.querySelectorAll('pre code').forEach(block=>{
          hljs.highlightElement(block);
          const langClass = [...block.classList].find(c=> c.startsWith('language-'));
          const lang = langClass ? langClass.replace('language-','') : '';
          const pre = block.parentElement;
          const wrap = document.createElement('div');
          wrap.className = 'code-wrap';
          pre.replaceWith(wrap);
          wrap.appendChild(pre);
          if(lang){
            const label = document.createElement('span');
            label.className = 'code-lang';
            label.textContent = lang;
            wrap.appendChild(label);
          }
        });
      })
      .catch(err=>{
        bEl.textContent = '본문을 불러오지 못했어요. ' + err.message;
      });
  }

  fetch('posts/manifest.json', { cache: 'no-store' })
    .then(res=>{
      if(!res.ok) throw new Error('posts/manifest.json을 불러오지 못했습니다 (' + res.status + ')');
      return res.json();
    })
    .then(renderPosts)
    .catch(err=>{
      postList.innerHTML = `<div class="error-state">글 목록을 불러오지 못했어요.<br>posts 폴더 안에 manifest.json이 있는지, 서버(로컬 서버 포함)를 통해 열었는지 확인해주세요.<br><small>${escapeHtml(err.message)}</small></div>`;
    });
</script>

</body>
</html>
